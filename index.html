<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11161b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- title y description los define cada ruta (React 19 los ubica en <head>) desde src/content.
         No duplicarlos acá: el navegador tomaría este y las rutas no podrían cambiarlo. -->

    <!-- Vista previa al compartir (redes, mensajería). Estos lectores no ejecutan JS,
         por eso va en el HTML. Mantener en sintonía con ui.meta en src/content/es/ui.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="Franco Amarilla — Full Stack Developer | AI Engineer" />
    <meta
      property="og:description"
      content="Portfolio de Franco Amarilla, Full Stack Developer y AI Engineer en Córdoba, Argentina: aplicaciones web con Java, Spring Boot, Angular y React, e integración de inteligencia artificial."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:url" content="https://francoamarilla.github.io/portfolio/" />
    <link rel="canonical" href="https://francoamarilla.github.io/portfolio/" />
    <meta property="og:image" content="https://francoamarilla.github.io/portfolio/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Franco Amarilla — Full Stack Developer | AI Engineer" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
